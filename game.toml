[video]
renderer = "opengl"
internal_resolution = "4k"
supersample = 2.0
resolution_reference_lines = 240
match_display_max_lines = 2160
antialiasing_mode = "fxaa_hq"
texture_filtering = "nearest"
texture_lod = "off"
anisotropic_filtering = 1
bloom = 0.35
geometry_correction = false
perspective_texturing = false
pgxp_cpu_mode = false
pgxp_preserve_projection = false
dithering = "off"
accurate_blending = true
fmv_chroma_smoothing = true
fmv_filter = "bicubic"
render_thread = true
present_thread = true
vsync = "off"
frame_interpolation = false
frame_interpolation_fps = 0
offer_frame_interpolation = false
frame_generation = false
frame_generation_method = "redraw"
aspect_ratio = "16:9"
post_shader = "shaders/hd2d.pfx"

[widescreen]
offer = true
offer_ultrawide = true
gte_game_mode = true
native_wide = false
full_2d = false
auto_ui_squash = false
hud_sprt_squash = false

[audio]
buffer_ms = 60
spu_hq = true

[controller]
default_mode = "analog"

# Online mount gate: digests + track count + optional TOC fingerprint
# (see docs/NETPLAY.md).
multitap_analog = true
[netplay]
require_cue = true
